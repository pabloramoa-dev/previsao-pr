name: Resgate de publicação — Previsão PR

# Uma alteração neste arquivo dispara um resgate pontual.
# O fluxo normal continua exclusivamente nos Reels das 06h e 18h.
# Recuperação de ambos os turnos: não substitui a publicação principal e respeita a trava anti-duplicação do Reel.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resgate_publicacao_pr.yml'
  workflow_dispatch:
  # Evento nativo do GitHub quando este repo muda de privado para publico.
  public:
  # Resgate independente: se o agendador do Reel principal falhar, tenta recuperar.
  schedule:
    - cron: '40 12 * * *'  # 09:40 America/Sao_Paulo
    - cron: '40 13 * * *'  # 10:40 America/Sao_Paulo
    - cron: '10 21 * * *'  # 18:10 America/Sao_Paulo — resgate da previsão de amanhã
    - cron: '10 22 * * *'  # 19:10 America/Sao_Paulo — segunda tentativa da noite

permissions:
  contents: read
  actions: write

jobs:
  solicitar_reel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Solicitar Reel inédito do turno apropriado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          hora=$(TZ=America/Sao_Paulo date +%H)
          minuto=$(TZ=America/Sao_Paulo date +%M)
          # Ao tornar o repo publico, resgatar somente o Reel da noite ainda valido.
          # Fora dessa janela, nao tentar publicar previsao vencida.
          if [[ "${{ github.event_name }}" == "public" ]] && (( 10#$hora < 17 || 10#$hora >= 23 )); then
            echo "Evento public fora da janela 17h-23h BRT: nenhuma publicacao automatica."
            exit 0
          fi
          # O cron que disparou define o turno, nao a hora em que o GitHub entregou o job.
          # Isso evita transformar um resgate da manha atrasado em publicacao da noite.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "$SCHEDULE_CRON" in
              '40 12 * * *'|'40 13 * * *')
                workflow="reel_manha.yml"
                if (( 10#$hora < 6 || 10#$hora > 13 || (10#$hora == 13 && 10#$minuto > 30) )); then
                  echo "Resgate da manha fora do prazo seguro: ${hora}:${minuto}."
                  exit 0
                fi
                ;;
              '10 21 * * *'|'10 22 * * *')
                workflow="reel_noite.yml"
                if (( 10#$hora < 17 || 10#$hora >= 23 )); then
                  echo "Resgate da noite fora do prazo seguro: ${hora}:${minuto}."
                  exit 0
                fi
                ;;
              *)
                echo "::error::Cron de resgate desconhecido: $SCHEDULE_CRON"
                exit 1
                ;;
            esac
          elif (( 10#$hora >= 6 && (10#$hora < 13 || (10#$hora == 13 && 10#$minuto <= 30)) )); then
            workflow="reel_manha.yml"
          elif (( 10#$hora >= 17 && 10#$hora < 23 )); then
            workflow="reel_noite.yml"
          else
            echo "Resgate fora da janela segura: ${hora}:${minuto}."
            exit 0
          fi
          echo "Resgate no horário de Brasília: ${hora}h. Workflow: ${workflow}"
          gh workflow run "$workflow" --repo "$REPO" --ref main -f publicar=true
          echo "Solicitação enviada. A conclusão e o media_id devem ser confirmados no workflow publicado."
