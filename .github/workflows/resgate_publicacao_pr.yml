name: Resgate de publicação — Previsão PR

# O fluxo normal continua nos Reels das 06h e 18h. O resgate confere se o turno
# saiu (media_id na fila), dispara só o turno pendente dentro da janela segura,
# acompanha a execução e termina VERMELHO se a Meta não confirmar.
# (Sem gatilho de push: editar este arquivo não dispara mais publicação.)
on:
  workflow_dispatch:
  # Disparo externo (cron-job.org): POST /dispatches {"event_type":"resgate"}
  # às 08:40 e 19:10 BRT. Não depende do cron do GitHub, que tem atrasado horas.
  repository_dispatch:
    types: [resgate]
  # Evento nativo do GitHub quando este repo muda de privado para publico.
  public:
  # Resgate independente: se o agendador do Reel principal falhar, tenta recuperar.
  schedule:
    - cron: '40 12 * * *'  # 09:40 America/Sao_Paulo
    - cron: '40 13 * * *'  # 10:40 America/Sao_Paulo
    - cron: '10 21 * * *'  # 18:10 America/Sao_Paulo — resgate da previsão de amanhã
    - cron: '10 22 * * *'  # 19:10 America/Sao_Paulo — segunda tentativa da noite

permissions:
  contents: read
  actions: write

jobs:
  resgatar:
    runs-on: ubuntu-latest
    # Acompanha o Reel disparado até o fim (render + publicação).
    timeout-minutes: 85
    concurrency:
      group: resgate-publicacao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Escolher turno pendente, disparar e confirmar media_id
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python3 -m scripts.resgate_publicacao
