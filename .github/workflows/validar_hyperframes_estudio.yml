name: Validar estúdio HyperFrames (sem publicação)
# Render real de Bira (06h) e Bia (18h) com o estúdio HyperFrames, com coleta
# ao vivo. Nunca publica: só deixa os MP4 no artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hyperframes/**'
      - 'src/previsao/render/characters/director.py'
      - 'src/previsao/render/characters/quality_direction.py'
      - 'tests/test_direcao_expressiva.py'
      - '.github/workflows/validar_hyperframes_estudio.yml'
permissions:
  contents: read
concurrency:
  group: validar-hf-estudio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        personagem: [bira, bia]
    env:
      OMP_NUM_THREADS: '2'
      HYPERFRAMES_NO_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/previsao_kokoro
          key: kokoro-v1.0
      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng
          pip install -r requirements/test.txt numpy scipy kokoro-onnx soundfile
      - name: Preparar HyperFrames
        uses: ./.github/actions/setup-hyperframes
      - name: Isolamento e testes do estúdio
        run: |
          python scripts/isolation_guard.py
          python -m pytest -q
      - name: Coletar previsão real para os seis quadros
        run: python -m scripts.collect_live output/estudio/snapshot.json --tier 2
      - name: Render ao vivo sem publicação
        env:
          PERSONAGEM: ${{ matrix.personagem }}
          FORMATO: ${{ matrix.personagem == 'bia' && 'amanha_no_estado' || 'antes_de_sair' }}
        run: |
          python hyperframes/gerar_hf.py --snapshot output/estudio/snapshot.json \
            --format "$FORMATO" --personagem "$PERSONAGEM" --out "output/estudio/$PERSONAGEM.mp4"
          python scripts/qa_video.py "output/estudio/$PERSONAGEM.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: estudio-hyperframes-${{ matrix.personagem }}
          path: |
            output/estudio/
            hyperframes/build/pacote.json
            output/estudio/*.quality.json
          retention-days: 3
          if-no-files-found: error
